[package]
name = "certificate-manager"
version = "0.1.0"
edition = "2021"
description = "Interactive terminal certificate manager for Arch Linux based systems"
license = "MIT"

[[bin]]
name = "certificate-manager"
path = "src/main.rs"

[dependencies]
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
